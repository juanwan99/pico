# workbench.aivia.asia retired. Dify / aivia-workbench is not a Pico product.
# Keep ACME so the cert can expire cleanly. Do not proxy Sub2API or Dify here.

server {
    listen 80;
    listen [::]:80;
    server_name workbench.aivia.asia;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 410;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.aivia.asia;

    ssl_certificate     /etc/letsencrypt/live/workbench.aivia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.aivia.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 410 "retired\n";
    }
}
