# Minimal LibreChat custom config for Pico product shell (v0.8.x / config 1.3.x)
version: 1.3.13
cache: true
interface:
  customWelcome: "Pico AI 工作台"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
endpoints:
  openAI:
    # Auto-title via LLM would re-enter pico-agent and create ghost Task/Run rows.
    # Titles still derive from the first user turn / ledger; API also short-circuits
    # any residual title prompts (stage #260 P0).
    titleConvo: false
    headers:
      X-Pico-Membership-Id: "{{LIBRECHAT_USER_ID}}"
      X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
