# Product stack for public VPS (LibreChat + Mongo + Pico API).
# Target: Aliyun light server 2C2G — keep Mongo cache small; build with low heap.
# Map DOMAIN_* to https://pico.aivia.asia (or your host). Do not publish API.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - pico_mongo:/data/db
    # not published — only internal
    mem_limit: 512m

  pico-api:
    image: python:3.12-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - pico_data:/app/data
    command: bash -lc "pip install -q -r requirements.txt && uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 18765"
    env_file:
      - .env
    environment:
      PICO_DATABASE_URL: sqlite+aiosqlite:///./data/pico.db
      PICO_ENV: production
      PICO_ACCEPT_TEST_ISSUER: "false"
      PICO_ALLOWED_MODELS: ${PICO_ALLOWED_MODELS:?set PICO_ALLOWED_MODELS}
      PICO_OPENAI_PROXY_KEY: ${PICO_OPENAI_PROXY_KEY:?set a strong internal proxy key}
    # not published
    mem_limit: 512m
    depends_on:
      - mongo

  librechat:
    build:
      context: ./apps/librechat
      dockerfile: Dockerfile
      args:
        # 2G host: do not use default 6144
        NODE_MAX_OLD_SPACE_SIZE: "1536"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3080"
    env_file:
      - ./apps/librechat/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongo:27017/LibreChat
      OPENAI_REVERSE_PROXY: http://pico-api:18765/v1
      OPENAI_API_KEY: ${PICO_OPENAI_PROXY_KEY:?set a strong internal proxy key}
      ENDPOINTS: openAI
      # First entry = default new-chat model (product brain = DeepSeek).
      OPENAI_MODELS: deepseek-chat,pico-agent
      APP_TITLE: Pico
      TITLE_CONVO: "false"
      ALLOW_REGISTRATION: "false"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "false"
      PICO_DEMO_SEED: ${PICO_DEMO_SEED:-0}
      PICO_SEED_DEMO_USER: ${PICO_DEMO_SEED:-0}
      PICO_DEMO_EMAIL: ${PICO_DEMO_EMAIL:-}
      PICO_DEMO_PASSWORD: ${PICO_DEMO_PASSWORD:-}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set LIBRECHAT_CREDS_IV}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set LIBRECHAT_JWT_REFRESH_SECRET}
      SEARCH: "false"
      DOMAIN_CLIENT: ${DOMAIN_CLIENT:-https://pico.aivia.asia}
      DOMAIN_SERVER: ${DOMAIN_SERVER:-https://pico.aivia.asia}
    depends_on:
      - mongo
      - pico-api
    mem_limit: 1024m

volumes:
  pico_mongo:
  pico_data:
