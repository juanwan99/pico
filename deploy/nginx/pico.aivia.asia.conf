# Pico public 443. Default: LibreChat 18088.
# Sub2API account door: cookie pico_sub2api_door=1 → 127.0.0.1:8081
# Enter:  /accounts/enter-sub2api
# Exit:   /accounts/exit-sub2api
# T-SUB2API-FACE. Do not publish 8081. Pico inference still New API only.

map $cookie_pico_sub2api_door $pico_app_upstream {
    default http://127.0.0.1:18088;
    1       http://127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name pico.aivia.asia;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pico.aivia.asia;

    ssl_certificate     /etc/letsencrypt/live/pico.aivia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pico.aivia.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PICO_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location = /accounts/enter-sub2api {
        add_header Set-Cookie "pico_sub2api_door=1; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=43200" always;
        return 302 /;
    }

    location = /accounts/exit-sub2api {
        add_header Set-Cookie "pico_sub2api_door=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0" always;
        return 302 /;
    }

    location / {
        proxy_pass $pico_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
