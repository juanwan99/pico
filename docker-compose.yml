# Optional local product stack. Production uses docker-compose.host.yml.
# Public local surface: 127.0.0.1:8080 only; Pico API and Mongo stay internal.
name: pico-local

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - pico_mongo:/data/db

  pico-api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pico_data:/app/data
      - ${PICO_SANDBOX_DISK_HOST:-./data/teacher-disks}:/var/lib/pico/teacher-disks
    command: >-
      bash -lc "pip install -q -r requirements.txt &&
      uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 18765"
    env_file:
      - .env
    environment:
      PICO_DATABASE_URL: sqlite+aiosqlite:///./data/pico.db
      PICO_SANDBOX_URL: http://pico-sandbox:18767
      PICO_SANDBOX_TOKEN: ${PICO_SANDBOX_TOKEN:-}
      PICO_SANDBOX_DISK: /var/lib/pico/teacher-disks
    depends_on:
      - mongo
      - pico-sandbox

  pico-sandbox:
    build:
      context: .
      dockerfile: services/sandbox_worker/Dockerfile
    privileged: false
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /dev/shm:size=64m
    environment:
      PICO_SANDBOX_HOST: "0.0.0.0"
      PICO_SANDBOX_PORT: "18767"
      PICO_SANDBOX_TOKEN: ${PICO_SANDBOX_TOKEN:-}
      HOME: /tmp/pico-sandbox-home
      XDG_CONFIG_HOME: /tmp/pico-sandbox-home/.config
      XDG_CACHE_HOME: /tmp/pico-sandbox-home/.cache
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      PICO_SANDBOX_PROFILE_ROOT: /tmp/pico-sandbox-profiles
      PICO_SANDBOX_DISK: /var/lib/pico/teacher-disks
    volumes:
      - ${PICO_SANDBOX_DISK_HOST:-./data/teacher-disks}:/var/lib/pico/teacher-disks
    # Internal only — do not publish 8080/18088.

  librechat:
    build:
      context: ./apps/librechat
      dockerfile: Dockerfile.pico-fast
      args:
        NODE_MAX_OLD_SPACE_SIZE: "1536"
    ports:
      - "127.0.0.1:8080:3080"
    env_file:
      - ./apps/librechat/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongo:27017/LibreChat
      OPENAI_REVERSE_PROXY: http://pico-api:18765/v1
      OPENAI_API_KEY: pico-dev
      ENDPOINTS: openAI
      # First entry = default new-chat model; UI exposes only Pico 快速 / Pico 深度.
      OPENAI_MODELS: pico-fast,pico-deep
      APP_TITLE: Pico
      ALLOW_REGISTRATION: "true"
      SEARCH: "false"
      DOMAIN_CLIENT: http://127.0.0.1:8080
      DOMAIN_SERVER: http://127.0.0.1:8080
    depends_on:
      - mongo
      - pico-api

volumes:
  pico_mongo:
  pico_data:
