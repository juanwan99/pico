name: 调查卡
description: 只查不改。过门要 ①点击 ②日志 ③源码。
labels: []
body:
  - type: textarea
    id: stamp
    attributes:
      label: 总管戳
      value: |
        总管戳：
        同域在飞？ 改这里
        残债新卡？ 否
    validations:
      required: true
  - type: textarea
    id: card
    attributes:
      label: 合同（四行）
      value: |
        # 调查卡 · T-改这里-ID

        ## 合同

        - **结果：** 查清改这里
        - **不准：** 装过 · 开始大改码 · 建议 T-*-DEBT · 自签 PASS
        - **过门：** ①点击 ②日志 ③源码
        - **部署：** 不部

        ## 回执

        ```text
        CLAIM T-改这里-ID · 窗名 · DONE
        SHA：live =
        查清：
        建议下一张执行卡结果（一句）：
        PASS：未签
        ```
    validations:
      required: true
