# Product stack for public VPS deploy (LibreChat + Mongo + Pico API).
# Not for Grok Live Preview. Map DOMAIN_* to your HTTPS host.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - pico_mongo:/data/db
    # not published — only internal

  pico-api:
    image: python:3.12-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - pico_data:/app/data
    command: bash -lc "pip install -q -r requirements.txt && uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 18765"
    env_file:
      - .env
    environment:
      PICO_DATABASE_URL: sqlite+aiosqlite:///./data/pico.db
    # not published

  librechat:
    build:
      context: ./apps/librechat
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:3080"
    env_file:
      - ./apps/librechat/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongo:27017/LibreChat
      OPENAI_REVERSE_PROXY: http://pico-api:18765/v1
      # Set these to your public https origin:
      # DOMAIN_CLIENT: https://pico.example.com
      # DOMAIN_SERVER: https://pico.example.com
    depends_on:
      - mongo
      - pico-api

volumes:
  pico_mongo:
  pico_data:
