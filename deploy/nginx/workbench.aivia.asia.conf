# Owner-only Sub2API console on workbench.aivia.asia.
# Upstream: Wei-Shaw/sub2api loopback 127.0.0.1:8081 (do not bind Sub2API on 0.0.0.0).
# Login is Sub2API email/password + Google Authenticator TOTP. Not a teacher frontend.
# Do not proxy this onto pico.aivia.asia. Do not revive Dify.

limit_req_zone $binary_remote_addr zone=workbench_limit:10m rate=60r/s;

upstream sub2api_loopback {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name workbench.aivia.asia;
    client_max_body_size 100M;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.aivia.asia;

    ssl_certificate     /etc/letsencrypt/live/workbench.aivia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.aivia.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location = /experts {
        default_type text/html;
        alias /var/www/aivia-experts/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Aivia-Experts "1" always;
    }

    location ^~ /experts/ {
        alias /var/www/aivia-experts/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Aivia-Experts "1" always;
    }

    limit_req zone=workbench_limit burst=120 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://sub2api_loopback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    error_page 429 = @ratelimit;
    location @ratelimit {
        default_type application/json;
        return 429 "{\"code\":\"rate_limit\",\"message\":\"今日访问过于频繁或并发过高，请稍后再试或联系管理员。\"}";
    }
}
