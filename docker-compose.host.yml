# Production layout used on Aliyun light server (host network).
# Public entry: Nginx 443 → 127.0.0.1:18088 only.
# Shared ECS: LibreChat must bind 18088 — never 8080 (edu-core-bff on same host).
#
# Demo seeding is off by default. Enable only for an explicitly approved demo:
#   PICO_DEMO_SEED=1 PICO_DEMO_EMAIL=... PICO_DEMO_PASSWORD=...
#
#   cd /opt/pico && git pull
#   docker compose -f docker-compose.host.yml up -d --force-recreate librechat
#   # or: bash scripts/vps-seed-demo-user.sh
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    network_mode: host
    command:
      [
        "mongod",
        "--bind_ip",
        "127.0.0.1",
        "--port",
        "27017",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]
    volumes:
      - pico_mongo:/data/db

  pico-api:
    image: pico-api:v13
    build:
      context: .
      # Production multi-step default is true Pi; image must ship pinned pi CLI.
      # Lean (no Node): Dockerfile.pico-api — not used by host deploy path.
      dockerfile: Dockerfile.pico-api.true-pi
      args:
        PICO_GIT_SHA: ${PICO_GIT_SHA:-unknown}
    restart: unless-stopped
    # B1: allow uvicorn lifespan drain (~45s) before SIGKILL on deploy recreate.
    stop_grace_period: 60s
    network_mode: host
    # CRITICAL: host network + public IP risk — always bind loopback only
    command:
      [
        "uvicorn",
        "app.main:app",
        "--app-dir",
        "services/api",
        "--host",
        "127.0.0.1",
        "--port",
        "18765",
      ]
    env_file:
      - .env
    environment:
      PICO_DATABASE_URL: sqlite+aiosqlite:///./data/pico.db
      PICO_API_HOST: "127.0.0.1"
      PICO_API_PORT: "18765"
      PICO_CORS_ORIGINS: "https://pico.aivia.asia,http://127.0.0.1:8080,http://localhost:8080"
      PICO_ENV: production
      PICO_ACCEPT_TEST_ISSUER: "false"
      PICO_ALLOWED_MODELS: ${PICO_ALLOWED_MODELS:?set PICO_ALLOWED_MODELS}
      PICO_OPENAI_PROXY_KEY: ${PICO_OPENAI_PROXY_KEY:?set a strong internal proxy key}
      PICO_GIT_SHA: ${PICO_GIT_SHA:-unknown}
      # Durable Kimi Session sandboxes (not ephemeral container /tmp)
      PICO_PI_AGENT_RUNTIME: "${PICO_PI_AGENT_RUNTIME:-1}"
      PICO_LEGACY_KIMI_AGENT_RUNTIME: "${PICO_LEGACY_KIMI_AGENT_RUNTIME:-0}"
      PICO_MCP_ALLOWLIST: "${PICO_MCP_ALLOWLIST:-mcp_time,mcp_workspace_stat}"
      PICO_MODEL_PROVIDER: "${PICO_MODEL_PROVIDER:-deepseek}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      PICO_KIMI_WORKDIR_BASE: /app/data/kimi-work
      PICO_PI_WORKDIR_BASE: /app/data/pi-work
      # True-Pi cutover (env_file wins when set; listed for ops visibility)
      # DEFAULT multi-step = pi-true when PICO_TRUE_PI_DEFAULT=1
      # Accident rollback: PICO_HOSTED_LOOP=1 only (see docs/OPS-TRUE-PI-ROLLBACK.md)
      PICO_TRUE_PI_DEFAULT: ${PICO_TRUE_PI_DEFAULT:-}
      PICO_HOSTED_LOOP: ${PICO_HOSTED_LOOP:-}
      PICO_TRUE_PI_CANARY: ${PICO_TRUE_PI_CANARY:-}
      PICO_TRUE_PI_BYPASS: ${PICO_TRUE_PI_BYPASS:-}
      PICO_TRUE_PI_SHADOW: ${PICO_TRUE_PI_SHADOW:-}
      PICO_TRUE_PI_BIN: ${PICO_TRUE_PI_BIN:-}
      PICO_SANDBOX_URL: http://127.0.0.1:18767
      PICO_SANDBOX_TOKEN: ${PICO_SANDBOX_TOKEN:-}
      PICO_SANDBOX_DISK: /var/lib/pico/teacher-disks
    volumes:
      - pico_data:/app/data
      - ${PICO_SANDBOX_DISK_HOST:-./data/teacher-disks}:/var/lib/pico/teacher-disks
      - ./.env:/app/.env:ro
    depends_on:
      - mongo

  pico-sandbox:
    image: pico-sandbox:v13
    build:
      context: .
      dockerfile: services/sandbox_worker/Dockerfile
    restart: unless-stopped
    # Stronger than S1 app-layer: own pid/user/net ns. Not privileged. Not host Chrome.
    privileged: false
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /dev/shm:size=64m
    ports:
      - "127.0.0.1:18767:18767"
    environment:
      PICO_SANDBOX_HOST: "0.0.0.0"
      PICO_SANDBOX_PORT: "18767"
      PICO_SANDBOX_TOKEN: ${PICO_SANDBOX_TOKEN:-}
      HOME: /tmp/pico-sandbox-home
      XDG_CONFIG_HOME: /tmp/pico-sandbox-home/.config
      XDG_CACHE_HOME: /tmp/pico-sandbox-home/.cache
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      PICO_SANDBOX_PROFILE_ROOT: /tmp/pico-sandbox-profiles
      PICO_SANDBOX_DISK: /var/lib/pico/teacher-disks
    volumes:
      - ${PICO_SANDBOX_DISK_HOST:-./data/teacher-disks}:/var/lib/pico/teacher-disks
    mem_limit: 512m
    pids_limit: 256

  librechat:
    image: pico-librechat:v13
    build:
      context: ./apps/librechat
      dockerfile: Dockerfile.pico-fast
      args:
        NODE_MAX_OLD_SPACE_SIZE: "1536"
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./apps/librechat/.env
    environment:
      HOST: "127.0.0.1"
      PORT: "18088"
      MONGO_URI: mongodb://127.0.0.1:27017/LibreChat
      OPENAI_REVERSE_PROXY: http://127.0.0.1:18765/v1
      OPENAI_API_KEY: ${PICO_OPENAI_PROXY_KEY:?set a strong internal proxy key}
      ENDPOINTS: openAI
      # Keep the shell contract identical to the API fail-closed allowlist.
      # The first entry is LibreChat's default for a new conversation.
      OPENAI_MODELS: ${PICO_ALLOWED_MODELS:?set PICO_ALLOWED_MODELS}
      APP_TITLE: Pico
      TITLE_CONVO: "false"
      ALLOW_REGISTRATION: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "false"
      SEARCH: "false"
      # avoid Meili fetch noise when search disabled
      MEILI_HOST: ""
      MEILI_NO_ANALYTICS: "true"
      DOMAIN_CLIENT: https://pico.aivia.asia
      DOMAIN_SERVER: https://pico.aivia.asia
      CONFIG_PATH: /app/librechat.yaml
      # Fixed-password demo accounts require explicit PICO_DEMO_SEED=1.
      PICO_DEMO_SEED: ${PICO_DEMO_SEED:-0}
      PICO_SEED_DEMO_USER: ${PICO_DEMO_SEED:-0}
      PICO_DEMO_EMAIL: ${PICO_DEMO_EMAIL:-}
      PICO_DEMO_PASSWORD: ${PICO_DEMO_PASSWORD:-}
      PICO_DEMO_NAME: Pico Teacher
      PICO_DEMO_USERNAME: teacher
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set LIBRECHAT_CREDS_IV}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set LIBRECHAT_JWT_REFRESH_SECRET}
      # set true once if password was changed wrongly:
      # PICO_SEED_DEMO_RESET_PASSWORD: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      # inject seed without rebuilding image
      - ./apps/librechat/api/server/index.js:/app/api/server/index.js:ro
      - ./apps/librechat/api/server/services/picoSeedDemoUser.js:/app/api/server/services/picoSeedDemoUser.js:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    depends_on:
      - mongo
      - pico-api

volumes:
  pico_mongo:
  pico_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
