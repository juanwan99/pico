name: controller-bot

# 定时空转已停。脚本留着，紧急才手动跑；默认 dry_run、不合 PR。
on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Merge yellow/FAST + CI green PRs"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      dry_run:
        description: "Dry run (no merge/comment)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: controller-bot
  cancel-in-progress: false

jobs:
  poll:
    name: controller-poll
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run controller bot poll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTROLLER_AUTO_MERGE: ${{ inputs.auto_merge || 'false' }}
          CONTROLLER_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          python scripts/controller_bot.py poll
