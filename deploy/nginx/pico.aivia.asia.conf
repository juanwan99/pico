# Pico on ECS — public 443 -> LibreChat loopback 18088 only.
# Sub2API is NOT a frontend on this host. Pico inference talks to New API only.

server {
    listen 80;
    listen [::]:80;
    server_name pico.aivia.asia;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pico.aivia.asia;

    ssl_certificate     /etc/letsencrypt/live/pico.aivia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pico.aivia.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PICO_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
