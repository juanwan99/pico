<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=390"/>
  <title>结果区 · 打开文件/网站</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #ececec; }
    .panel { width: 390px; height: 844px; background: #fff; color: #1a1a1a; display: flex; flex-direction: column; }
    .hdr { height: 44px; display: flex; align-items: center; padding: 0 8px; background: #fafafa; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 13px; font-weight: 600; }
    .hdr .sub { color: #8c8c8c; font-weight: 400; margin-left: 8px; font-size: 12px; }
    .meta { padding: 8px; border-bottom: 1px solid rgba(0,0,0,.05); }
    .meta .url { font-size: 11px; color: #6b6b6b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .copy { font-size: 11px; margin-top: 4px; }
    .src { margin: 8px; padding: 8px 10px; border: 1px solid #cfe0ff; background: #f5f9ff; border-radius: 8px; }
    .src b { font-size: 12px; color: #1a3a7a; }
    .src a { display: block; margin-top: 4px; font-size: 12px; color: #3b6fd9; }
    img.shot { display: block; width: 390px; background: #111; flex: 1; object-fit: contain; }
    iframe.html { flex: 1; border: 0; width: 100%; background: #fff; }
    pre.txt { flex: 1; margin: 0; padding: 12px; font-size: 12px; background: #fafafa; overflow: auto; }
    .office { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #6b6b6b; font-size: 12px; }
  </style>
</head>
<body>
  <aside class="panel" data-testid="result-panel" aria-label="结果区">
    <div class="hdr" id="hdr">网页 <span class="sub">概览 · 工作空间文件 · 网页</span></div>
    <div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </aside>
  <script>
    const q = new URLSearchParams(location.search);
    const mode = q.get("mode") || "site";
    const shot = q.get("shot") || "../pack-result-web-pane/01-pane-example-com.png";
    const body = document.getElementById("body");
    const hdr = document.getElementById("hdr");
    if (mode === "html") {
      hdr.innerHTML = '概览 <span class="sub">打开 page.html · 铺满</span>';
      body.innerHTML = '<div class="meta"><div class="url">page.html · 安全预览铺满结果区</div></div>'
        + '<iframe class="html" sandbox="" srcdoc="<html><body style=\'margin:0;font-family:system-ui;background:linear-gradient(#1d4ed8,#7c3aed);color:#fff;min-height:800px;padding:28px\'><h1 style=\'font-size:32px;margin:0 0 12px\'>Hello pane</h1><p style=\'font-size:16px;line-height:1.6;max-width:18rem\'>HTML 打开铺满右侧结果区，主路径不是 window.open / 新窗口。</p><div style=\'margin-top:24px;background:#fff;color:#1a1a1a;border-radius:16px;padding:16px\'><strong>page.html</strong><p>结果区 390 宽预览</p></div></body></html>"></iframe>';
    } else if (mode === "source") {
      hdr.innerHTML = '网页 <span class="sub">点来源后</span>';
      body.innerHTML = '<div class="src"><b>来源</b><a href="#">Example Domain</a></div>'
        + '<div class="meta"><div class="url">Example Domain · https://example.com/</div>'
        + '<div class="copy">请在此画面自行登录，不要在聊天里发送密码</div></div>'
        + '<img class="shot" alt="隔离浏览器画面" src="' + shot + '"/>';
    } else {
      hdr.innerHTML = '网页 <span class="sub">打开 example.com</span>';
      body.innerHTML = '<div class="meta"><div class="url">Example Domain · https://example.com/</div>'
        + '<div class="copy">请在此画面自行登录，不要在聊天里发送密码</div></div>'
        + '<img class="shot" alt="隔离浏览器画面" src="' + shot + '"/>';
    }
  </script>
</body>
</html>
