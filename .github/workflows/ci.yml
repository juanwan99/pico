name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Install Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Ruff
        run: ruff check services tests scripts

      - name: Agent pin check
        run: python scripts/check_agent_pin.py

      - name: N3 skill snapshot smoke
        run: python scripts/n3_skill_snapshot_smoke.py

      - name: Security proof (Shell/File/Web/MCP off)
        run: |
          python scripts/security_proof.py
          pytest -q tests/security

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Integration tests
        run: pytest -q tests/integration

      - name: Model hello (optional — honest BLOCKED without secret)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          set +e
          python scripts/model_hello.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::S1 BLOCKED — KIMI_API_KEY not configured (expected until secret is set)"
            exit 0
          fi
          exit "$code"

  product-ui:
    name: product-ui-librechat-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require LibreChat shell; forbid web/workbench
        run: |
          bash scripts/assert-product-identity.sh
          test -f apps/librechat/package.json
          test -f apps/README.md
          grep -q 'librechat' apps/README.md
          echo "OK: product UI = apps/librechat"

  product-ui-tests:
    name: product-ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/librechat
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/librechat/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build workspace packages
        run: |
          if ! npm run build:data-provider; then
            echo "data-provider build failed; retry after unrun"
            npm install --no-save --legacy-peer-deps unrun
            npm run build:data-provider
          fi
          npm run build:data-schemas
          npm run build:client-package

      # Owner 2026-08-23 A: Pico-named client tests that are currently green.
      # Full client jest (313 suites) = 29 failed / 90 failed: zh-Hans vs
      # upstream English UI tests + stale Pico copy. Not fixed in this card.
      # Excluded here (stale, tracked in #627): usePicoConversationStatusMap.spec.ts,
      # usePicoTaskLedger.spec.tsx (not __tests__/), usePicoTaskLedger.cancel.integration,
      # picoSandboxSession.test.ts.
      # packages/api jest dropped: 312 files hung past 15min (run 32644669520 cancelled).
      # This card is a UI door, not an api-package door.
      - name: Client jest (Pico target suite)
        working-directory: apps/librechat/client
        env:
          NODE_ENV: development
          NODE_OPTIONS: --max-old-space-size=4096
        run: >
          npx jest --ci --coverage=false
          --testPathPatterns='src/hooks/Pico/|src/utils/__tests__/pico|src/components/Chat/__tests__/MainDeliveryStrip|src/components/Chat/__tests__/ResultPanel|src/components/Chat/__tests__/Landing.composer|src/components/Chat/__tests__/ChatTitleEditor|src/components/Chat/__tests__/PointsBar|src/components/Chat/__tests__/TurnPointsFooter|src/components/Chat/__tests__/RunTimeline|src/components/Workbench/GatewayAdminPage'
          --testPathIgnorePatterns='Pico/usePicoTaskLedger\.spec\.tsx$|Pico/usePicoTaskLedger\.cancel|usePicoConversationStatusMap\.spec|picoSandboxSession\.test'

      - name: Pico proxy jest (preview=1 allowlist)
        working-directory: apps/librechat/api
        env:
          NODE_ENV: test
        run: npx jest --ci --coverage=false --testPathPatterns='server/routes/pico.test'

