<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=390"/>
  <title>Login</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f8; }
    .box { width: 390px; min-height: 520px; padding: 32px 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #555; font-size: 13px; }
    label { display: block; font-size: 13px; margin-top: 14px; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 10px; background: #1a5fb4; color: #fff; border: 0; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sign in</h1>
    <p>Public demo login box (fixture). Password stays on this page.</p>
    <label>Username<input value="tomsmith"/></label>
    <label>Password<input type="password" value=""/></label>
    <button>Login</button>
  </div>
</body>
</html>
