name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "grok/**", "docs/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check services tests scripts

      - name: Agent pin check
        run: python scripts/check_agent_pin.py

      - name: Security proof (Shell/File/Web/MCP off)
        run: |
          python scripts/security_proof.py
          pytest -q tests/security

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Model hello (optional — honest BLOCKED without secret)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          set +e
          python scripts/model_hello.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::S1 BLOCKED — KIMI_API_KEY not configured (expected until secret is set)"
            exit 0
          fi
          exit "$code"

  product-ui:
    name: product-ui-librechat-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require LibreChat shell; forbid web/workbench
        run: |
          bash scripts/assert-product-identity.sh
          test -f apps/librechat/package.json
          test -f apps/README.md
          grep -q 'librechat' apps/README.md
          echo "OK: product UI = apps/librechat"
