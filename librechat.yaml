# Minimal LibreChat custom config for Pico product shell (v0.8.x / config 1.3.x)
version: 1.3.13
cache: true
interface:
  customWelcome: "Pico AI 工作台"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
endpoints:
  openAI:
    # Titles come from the first user turn (client snippet + updateConversation).
    # LLM TITLE_CONVO would re-enter pico-agent; #260 short-circuit is not a product title OS.
    titleConvo: false
    headers:
      # Joint school:membership when edu SSO is present; else LibreChat user id.
      # Must match /api/pico membershipFromReq so school land + 文件页读同一账本。
      X-Pico-Membership-Id: "{{PICO_MEMBERSHIP_ID}}"
      # SSO / LibreChat display name → thin day-use SYSTEM (b64: for CJK).
      X-Pico-Display-Name: "{{LIBRECHAT_USER_NAME}}"
      X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
