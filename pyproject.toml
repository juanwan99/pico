[project]
name = "pico"
version = "0.1.0"
description = "Pico — standalone AI foundation (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # API
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1,<4",
  # DB (D1 scaffold; D2 hardens schema)
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  # Orchestrator — PINNED (see docs/D1-FREEZE.md)
  "kimi-agent-sdk==0.0.5",
  "kimi-cli==1.12.0",
  "openai>=1.50,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["services/api", "services/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/app", "services/orchestrator/pico_orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"services/orchestrator/pico_orchestrator/agent_assets" = "pico_orchestrator/agent_assets"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
