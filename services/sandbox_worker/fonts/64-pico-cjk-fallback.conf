<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pico sandbox fonts, second pass (pico#1295). A Latin family such as
     Liberation Serif / Times New Roman only gets its generic "serif" /
     "sans-serif" added in 45-latin, after 24-pico-cjk ran. Without this,
     a CJK or symbol glyph (①, ℃, ∠) missing from that Latin font fell back
     to WenQuanYi. Runs before 65-nonlatin so Noto CJK SC wins. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono CJK SC</family></prefer></alias>
</fontconfig>
